apply plugin: 'com.android.application'

def permanentSigningProperties = new Properties()
def permanentSigningPropertiesFile = new File(System.getProperty('user.home'), '.cyc-gestion-signing/signing.properties')
if (permanentSigningPropertiesFile.exists()) {
    permanentSigningPropertiesFile.withInputStream { permanentSigningProperties.load(it) }
}

def permanentSigningValue = { String key ->
    System.getenv(key) ?: permanentSigningProperties.getProperty(key)
}

def permanentSigningStorePath = permanentSigningValue('CYC_ANDROID_KEYSTORE_PATH')
def permanentSigningStorePassword = permanentSigningValue('CYC_ANDROID_STORE_PASSWORD')
def permanentSigningKeyAlias = permanentSigningValue('CYC_ANDROID_KEY_ALIAS')
def permanentSigningKeyPassword = permanentSigningValue('CYC_ANDROID_KEY_PASSWORD')
def permanentSigningMissingValues = [
    CYC_ANDROID_KEYSTORE_PATH: permanentSigningStorePath,
    CYC_ANDROID_STORE_PASSWORD: permanentSigningStorePassword,
    CYC_ANDROID_KEY_ALIAS: permanentSigningKeyAlias,
    CYC_ANDROID_KEY_PASSWORD: permanentSigningKeyPassword,
].findAll { key, value -> !value }.keySet()

if (!permanentSigningMissingValues.isEmpty()) {
    throw new GradleException("Falta la firma permanente de C&C Gestión Prueba: ${permanentSigningMissingValues.join(', ')}. Configurá las variables de entorno o %USERPROFILE%\\.cyc-gestion-signing\\signing.properties.")
}

android {
    namespace = "com.cycgestion.prueba"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cycgestion.prueba"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Keep the same package and signing identity so Android updates the
        // installed test app in place and retains its local data.
        versionCode 2
        versionName "0.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        permanentTest {
            storeFile file(permanentSigningStorePath)
            storePassword permanentSigningStorePassword
            keyAlias permanentSigningKeyAlias
            keyPassword permanentSigningKeyPassword
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.permanentTest
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.permanentTest
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
