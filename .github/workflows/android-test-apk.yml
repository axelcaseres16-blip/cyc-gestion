name: APK Android de prueba

on:
  push:
    branches:
      - fix/anulacion-integral-durable
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Compilar APK debug
    if: github.ref == 'refs/heads/fix/anulacion-integral-durable'
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias web
        run: pnpm install --frozen-lockfile

      - name: Generar aplicación web
        run: pnpm run build

      - name: Sincronizar Capacitor Android
        run: pnpm exec cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Habilitar Gradle Wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Restaurar firma permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          KEYSTORE_BASE64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          KEYSTORE_BASE64="${KEYSTORE_BASE64#ANDROID_KEYSTORE_BASE64=}"
          KEYSTORE_BASE64="${KEYSTORE_BASE64#\"}"
          KEYSTORE_BASE64="${KEYSTORE_BASE64%\"}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cyc-gestion-prueba.jks"
          test -s "$RUNNER_TEMP/cyc-gestion-prueba.jks"

      - name: Compilar app-debug.apk con firma permanente
        working-directory: android
        env:
          CYC_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cyc-gestion-prueba.jks
          CYC_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          CYC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CYC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Verificar certificado del APK
        run: |
          EXPECTED_SHA256="8912004da9b04a25c23987d3e91cd213680d30d2f632943308bafd1a7837b772"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          CERTIFICATE_DETAILS="$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk 2>&1)"
          ACTUAL_SHA256="$(printf '%s\n' "$CERTIFICATE_DETAILS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          echo "Firma esperada: $EXPECTED_SHA256"
          echo "Firma obtenida: ${ACTUAL_SHA256:-no detectada}"
          test -n "$ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          echo "Firma verificada: $ACTUAL_SHA256"

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: CYC-Gestion-Prueba-app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Descargar APK para la Release de prueba
        uses: actions/download-artifact@v4
        with:
          name: CYC-Gestion-Prueba-app-debug-${{ github.sha }}
          path: release-apk

      - name: Actualizar Release de prueba
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: test-apk-fix-anulacion-integral-durable
          SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "APK debug actualizado desde la rama de prueba. Commit: $SHA"
            gh release upload "$TAG" release-apk/app-debug.apk --clobber
          else
            gh release create "$TAG" release-apk/app-debug.apk \
              --target "$SHA" \
              --title "APK de prueba — C&C Gestión" \
              --notes "APK debug actualizado desde la rama de prueba. Commit: $SHA" \
              --prerelease
          fi

      - name: Eliminar firma temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/cyc-gestion-prueba.jks"
